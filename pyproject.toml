[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "e4"
version = "0.2.0"
description = "A portable, extensible, typed Root-Cause Analysis (RCA) engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.2.6",
  "scipy==1.15.3",
  "scikit-learn==1.7.2",
  "mypy==1.19.1",
  "jsonschema==4.26.0",
  "typing_extensions>=4.5.0",
]

[project.scripts]
e4 = "e4.cli:main"

[tool.setuptools.packages.find]
include = ["e4", "e4.*", "adapters", "adapters.*", "benchmarks", "benchmarks.*"]
exclude = ["e4core*", "e4infra*", "e4baseline*"]

[tool.setuptools.package-data]
"e4.data" = ["resources/*.json", "resources/*.txt"]
"e4.prompts" = ["resources/*.md"]
"e4.starters" = ["resources/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
